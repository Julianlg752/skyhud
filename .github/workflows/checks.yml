# Runs on every pull request and on main: tests, builds and the privacy check.
# Pull requests from forks get a read-only token and no secrets; first runs from
# outside contributors wait for the owner's approval (repo setting).
name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install gitleaks
        run: sh .github/scripts/install-gitleaks.sh
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build for macOS and Windows (no cgo)
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/skyhud
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /dev/null ./cmd/skyhud
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/skyhud
      - name: Test the privacy check
        run: sh scripts/test-check-private.sh

  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: sh .github/scripts/install-gitleaks.sh
      - name: Find the commits to check
        id: range
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD"); head=$PR_HEAD
          else
            base=$PUSH_BEFORE; head=$GITHUB_SHA
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
      - name: No flight data, keys, big files or secrets in any commit
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          # Use the check from main, so a pull request can't weaken the check that judges it.
          # (Until main has the --range mode, the pull request's own copy is used.)
          git show "$BASE:scripts/check-private.sh" > "$RUNNER_TEMP/check.sh" 2>/dev/null || true
          grep -q -- '--range' "$RUNNER_TEMP/check.sh" || cp scripts/check-private.sh "$RUNNER_TEMP/check.sh"
          sh "$RUNNER_TEMP/check.sh" --range "$BASE" "$HEAD"
      - name: Flag changes to code that runs on users' computers
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          risky=$(git diff --name-only "$BASE" "$HEAD" | grep -E '^(internal/plugin/|internal/design/|cmd/|scripts/|packaging/|\.github/|\.gitleaks|go\.mod$|go\.sum$)' || true)
          if [ -n "$risky" ]; then
            {
              echo "### Review closely: sensitive files changed (they run commands, install, check designs, or run in CI)"
              echo "$risky" | sed 's/^/- `/; s/$/`/'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$risky" | while read -r f; do echo "::warning file=$f::Sensitive file (runs commands, installs, checks designs, or runs in CI): review it line by line"; done
          fi
          # Lines marked gitleaks:allow are skipped by the secret scan: each one needs a human look.
          if git diff "$BASE" "$HEAD" | grep -E '^\+' | grep -q 'gitleaks:allow'; then
            echo "- New \`gitleaks:allow\` lines: the secret scan skips them, check each one" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::New gitleaks:allow lines turn off the secret scan for those lines: check each one"
          fi
